<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'">
<title>Inkling</title>
<link rel="stylesheet" href="../node_modules/@fontsource/kalam/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/kalam/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-sans/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-sans/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-sans/600.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bd" tabindex="0" aria-label="Sheet">
  <div id="world"><svg id="mk"></svg></div>
  <svg id="lasso"></svg>
  <div class="pop" id="pop" hidden></div>
  <div class="pal" id="pal" hidden><input id="palIn" placeholder="Jump to a jot" autocomplete="off" spellcheck="false"><div id="palList"></div></div>
  <div id="hint"></div>
</div>
<div id="drag"></div>
<button type="button" id="title" hidden title="Find a note"></button>

<div class="pal lib" id="lib" hidden>
  <input id="libIn" placeholder="Find a note by any word in it" autocomplete="off" spellcheck="false">
  <div id="libList"></div>
  <div id="libFoot"></div>
</div>

<div class="sheet-overlay" id="help" hidden>
  <div class="card" role="dialog" aria-label="Keyboard shortcuts">
    <header><h1>Inkling</h1><p id="helpSub"></p></header>
    <section class="ref" id="helpRef"></section>
  </div>
</div>

<div class="sheet-overlay" id="settings" hidden>
  <div class="card" role="dialog" aria-label="Settings">
    <header><h1>Settings</h1><button type="button" id="setDone">Done</button></header>
    <section class="opt">
      <h2>Notes</h2>
      <label class="switch">
        <input type="checkbox" id="optLib">
        <span class="track" aria-hidden="true"></span>
        <span class="txt"><b>Library</b><span>Keep many notes, each in its own file, and find any of them by a word inside. Turn it off to always open the same single sheet. Other notes stay saved and come back when you turn it on.</span></span>
      </label>
    </section>
    <section>
      <div class="khead"><h2>Keys</h2><span id="keyMsg" role="status"></span><button type="button" id="keysReset">Reset all</button></div>
      <div id="keyRows"></div>
      <p class="knote">Click a key to change it, or + to add another. <kbd>Esc</kbd> cancels.</p>
    </section>
  </div>
</div>

<script src="keymap.js"></script>
<script src="app.js"></script>
<script src="notes.js"></script>
<script src="settings.js"></script>
</body>
</html>
